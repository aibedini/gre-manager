name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release artifacts (pinned script + checksum)
        run: |
          set -e
          cp gre-manager.sh gre
          chmod +x gre
          sha256sum gre > gre.sha256
          tar czf gre-hub.tar.gz hub/
          sha256sum gre-hub.tar.gz > gre-hub.tar.gz.sha256
          echo "--- artifacts ---"
          ls -la gre gre.sha256 gre-hub.tar.gz gre-hub.tar.gz.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gre
            gre.sha256
            gre-hub.tar.gz
            gre-hub.tar.gz.sha256
          generate_release_notes: true
